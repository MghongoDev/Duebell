services:
  - type: web
    name: duebell
    runtime: python
    plan: free
    # requirements.txt is the lock: exact versions, runtime packages only.
    buildCommand: pip install -r requirements.txt
    # Seeds the demo only when the database has no users. On the free plan
    # the SQLite file has no persistent disk: it is lost at every deploy,
    # restart and spin-down (after 15 idle minutes), and the next start seeds
    # a fresh demo. A persistent disk needs a paid instance type (issue #87).
    # A hosted demo must set its own DEMO_PASSWORD.
    startCommand: python scripts/seed.py --if-empty --require-password && uvicorn app.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PAYPAL_MODE
        value: mock
      - key: LLM_MODE
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./duebell.db
      - key: AMOUNT_CAP_CENTS
        value: "1000000"
      - key: ALLOWED_CURRENCIES
        value: USD
      - key: TERMS_MIN_DAYS
        value: "0"
      - key: TERMS_MAX_DAYS
        value: "120"
      - key: REMINDER_WINDOW_DAYS
        value: "3"
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
