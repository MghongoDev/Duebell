services:
  - type: web
    name: duebell
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Seeds the demo only when the database has no users, so a restart on a
    # persistent disk keeps everyone's data. The free plan's disk is wiped on
    # each deploy anyway. A hosted demo must set its own DEMO_PASSWORD.
    startCommand: python scripts/seed.py --if-empty --require-password && uvicorn app.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PAYPAL_MODE
        value: mock
      - key: LLM_MODE
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./duebell.db
      - key: AMOUNT_CAP_CENTS
        value: "1000000"
      - key: ALLOWED_CURRENCIES
        value: USD
      - key: TERMS_MIN_DAYS
        value: "0"
      - key: TERMS_MAX_DAYS
        value: "120"
      - key: REMINDER_WINDOW_DAYS
        value: "3"
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
