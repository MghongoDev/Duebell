# The project's checks on every push and pull request (issue #28).
# Everything runs in mock mode: no secrets, no PayPal, no model, no email.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYPAL_MODE: mock
      LLM_MODE: mock
      EMAIL_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (pyflakes)
        run: ruff check --select F app scripts tests

      - name: Tests
        run: python -m pytest -q

      - name: Smoke run
        run: python scripts/smoke.py

      - name: Offline evals
        run: python scripts/evals.py
