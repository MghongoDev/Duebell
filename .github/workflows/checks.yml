# The project's checks on every push and pull request (issue #28).
# Everything runs in mock mode: no secrets, no PayPal, no model, no email.
# The same checks run on 3.12, the oldest supported Python and the one Render
# uses, and on 3.15, the newest the lock installs on (issue #105).
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not cancel the other and hide its result.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]
    timeout-minutes: 15
    env:
      PAYPAL_MODE: mock
      LLM_MODE: mock
      EMAIL_MODE: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # setup-python keys the pip cache on the OS, the Python version and
          # the hash of the files below, so each version keeps its own cache.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: ruff check --select F app scripts tests

      - name: Tests
        run: python -m pytest -q

      - name: Smoke run
        run: python scripts/smoke.py

      - name: Offline evals
        run: python scripts/evals.py
