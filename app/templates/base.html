<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Duebell{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="bell" aria-hidden="true"></span>
      <span>Duebell</span>
    </a>
    <p class="tagline">A bell that rings when an invoice comes due.</p>
    {% if user %}
    <form class="signed-in" method="post" action="/logout">
      <span class="muted">{{ user.email }}</span>
      <button class="ghost small" type="submit">Sign out</button>
    </form>
    {% endif %}
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>Sandbox demo. No real money moves.</span>
  </footer>
</body>
</html>
